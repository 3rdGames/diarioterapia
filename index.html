<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diário Terapia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Diário Terapia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="w" id="app"></div>
<script>
function showErr(t){var a=document.getElementById('app');if(a&&!a.children.length)a.textContent='Erro ao carregar o app: '+t;a.style.cssText='white-space:pre-wrap;word-break:break-word;padding:20px;font:14px sans-serif'}
addEventListener('error',function(e){showErr((e.message||'não foi possível carregar '+((e.target&&(e.target.src||e.target.href))||'um arquivo')))},true);
addEventListener('unhandledrejection',function(e){showErr(String(e.reason&&e.reason.message||e.reason))});
</script>
<script type="module" src="app.js"></script>
</body>
</html>
